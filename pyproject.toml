[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Telco customer churn prediction training pipeline"
requires-python = ">=3.13"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "mlflow==3.18.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "seaborn",
    "matplotlib",
    "statsmodels",
    "lightgbm",
    "optuna",
]

[project.scripts]
churn-train = "churn.train:main"

[tool.setuptools.packages.find]
where = ["src"]
